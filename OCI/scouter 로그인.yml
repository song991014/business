info:
  name: scouter 로그인
  type: http
  seq: 2

http:
  method: POST
  url: "{{process.env.SCOUTER_URL}}/scouter/v1/user/login"
  body:
    type: json
    data: |-
      {
        "user": {
          "id": "{{process.env.SCOUTER_ID}}",
          "password": "{{process.env.SCOUTER_PW}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
